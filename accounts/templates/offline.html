<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Apartment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #9D6DC2 0%, #5A2D82 100%);
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .offline-container {
            background: #6D3A8E;
            border-radius: 16px;
            padding: 60px 40px;
            box-shadow: 0 4px 15px rgba(90,45,130,0.25);
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.08);
        }
        
        .offline-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.8;
        }
        
        h1 {
            font-size: 32px;
            color: #FFFADA;
            margin-bottom: 15px;
            font-weight: 700;
        }
        
        p {
            font-size: 16px;
            color: #FFCD7B;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .btn {
            background: linear-gradient(135deg, #FFA719, #FFCD7B);
            color: #2a2a2a;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.15s ease-in-out, box-shadow 0.3s;
        }
        
        .btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 10px rgba(255,167,25,0.4);
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            font-size: 14px;
            color: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1>You're Offline</h1>
        <p>
            Your device is currently offline. Don't worry! You can still view cached content 
            and any data you've saved will be synced when you're back online.
        </p>
        <button class="btn" onclick="window.location.reload()">Try Again</button>
        <div class="status" id="status">
            Checking connection...
        </div>
    </div>
    
    <script>
        // Check connection status
        function updateStatus() {
            const statusEl = document.getElementById('status');
            if (navigator.onLine) {
                statusEl.textContent = '✅ Connection restored! Refreshing...';
                setTimeout(() => window.location.reload(), 1000);
            } else {
                statusEl.textContent = '⚠️ Still offline';
            }
        }
        
        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
        updateStatus();
    </script>
</body>
</html>
